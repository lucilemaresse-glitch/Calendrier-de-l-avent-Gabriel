<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notre calendrier de l'Avent ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

:root {

  --cream: #fff7eb;

  --red: #a52b40;

  --green: #245640;

  --gold: #d6b46a;

  --dark: #392b28;

}

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  min-height: 100vh;

  padding: 25px 15px 45px;

  font-family: 'Nunito', sans-serif;

  color: var(--dark);

  text-align: center;

  background:

    radial-gradient(circle at 10% 20%, white 0 2px, transparent 3px),

    radial-gradient(circle at 80% 35%, white 0 2px, transparent 3px),

    var(--cream);

  background-size: 70px 70px, 100px 100px, auto;

}

header {

  max-width: 700px;

  margin: 20px auto 30px;

}

.subtitle {

  color: var(--green);

  font-weight: 800;

  letter-spacing: 3px;

  font-size: 12px;

  text-transform: uppercase;

}

h1 {

  color: var(--red);

  font-family: 'Great Vibes', cursive;

  font-size: clamp(43px, 9vw, 68px);

  font-weight: normal;

  margin: 10px 0;

}

.intro {

  font-size: 15px;

  line-height: 1.7;

  max-width: 480px;

  margin: auto;

}

.decoration {

  color: var(--gold);

  font-size: 25px;

  letter-spacing: 8px;

  margin: 15px 0;

}

#countdown {

  color: var(--green);

  font-weight: 800;

  margin: 18px 0 25px;

}

.calendar {

  max-width: 650px;

  margin: auto;

  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap: 13px;

}

.day {

  min-height: 105px;

  border: 2px solid var(--gold);

  border-radius: 15px 15px 20px 20px;

  color: white;

  cursor: pointer;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 5px;

  box-shadow: 0 5px 0 rgba(90,55,35,.13);

  transition: transform .2s, box-shadow .2s;

  position: relative;

}

.day:nth-child(odd) {

  background: var(--red);

}

.day:nth-child(even) {

  background: var(--green);

}

.day:not(.locked):hover {

  transform: translateY(-5px);

  box-shadow: 0 9px 0 rgba(90,55,35,.13);

}

.day-number {

  font-size: 32px;

  font-weight: 800;

}

.day-label {

  font-size: 11px;

  letter-spacing: 1px;

  text-transform: uppercase;

}

.day.opened {

  background: #f2dfb7;

  color: var(--green);

}

.day.opened::after {

  content: "★";

  position: absolute;

  top: 5px;

  right: 9px;

  color: var(--red);

}

.greeting {

  color: var(--red);

  font-family: 'Great Vibes', cursive;

  font-size: 35px;

  margin-top: 35px;

}

footer {

  margin-top: 35px;

  color: var(--green);

  font-size: 13px;

}

.modal {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 10;

  background: rgba(25,35,28,.65);

  padding: 20px;

  align-items: center;

  justify-content: center;

}

.modal.show {

  display: flex;

}

.modal-content {

  background: var(--cream);

  border: 3px solid var(--gold);

  border-radius: 22px;

  padding: 30px 22px;

  width: min(100%, 420px);

  animation: appear .25s ease;

}

@keyframes appear {

  from {

    transform: scale(.85);

    opacity: 0;

  }

  to {

    transform: scale(1);

    opacity: 1;

  }

}

.modal-content h2 {

  color: var(--red);

  font-family: 'Great Vibes', cursive;

  font-size: 38px;

  font-weight: normal;

  margin: 0 0 15px;

}

.modal-content p {

  line-height: 1.7;

  white-space: pre-line;

}

.close {

  border: 0;

  border-radius: 30px;

  padding: 10px 22px;

  background: var(--green);

  color: white;

  font: inherit;

  font-weight: 800;

  cursor: pointer;

  margin-top: 12px;

}

@media (max-width: 420px) {

  .calendar {

    gap: 8px;

  }

  .day {

    min-height: 85px;

    border-radius: 12px;

  }

  .day-number {

    font-size: 26px;

  }

  .day-label {

    font-size: 9px;

  }

}

</style>

</head>

<body>

<header>

  <div class="subtitle">Un mois rempli de magie</div>

  <div class="decoration">✦ ❄ ✦</div>

  <h1>Notre calendrier de l'Avent</h1>

  <p class="intro">

    24 petites surprises pour rendre ton mois de décembre

    encore plus magique. Une case par jour, un petit peu

    d'amour chaque matin. ❤️

  </p>

  <div class="decoration">🎄 ✨ 🎄</div>

  <div id="countdown"></div>

</header>

<main>

  <div class="calendar" id="calendar"></div>

</main>

<div class="greeting">Avec tout mon amour ❤️</div>

<footer>

  Joyeux mois de décembre, mon cœur !<br>

  Fait avec amour, spécialement pour toi.

</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">

  <div class="modal-content">

    <h2 id="modal-title"></h2>

    <div id="modal-body"></div>

    <button class="close" onclick="closeModal()">Refermer ❤️</button>

  </div>

</div>

<script>

const activities = [

  "Bienvenue dans ton calendrier de l'Avent ! ❤️ Chaque jour, une nouvelle surprise t'attend. Je t'aime !",

  "Aujourd'hui, retrouve les mots cachés : AMOUR, GABRIEL, LUCILE, BISOU et NOËL.",

  "Un petit souvenir de nous : raconte-moi ton moment préféré depuis notre rencontre.",

  "Petit quiz : quel jour nous sommes-nous rencontrés ?",

  "Une surprise t'attend : reconstitue notre puzzle !",

  "Défi photo : envoie-moi une photo de ton moment préféré de la journée.",

  "Aujourd'hui, prends quelques minutes pour lire mon petit mot d'amour. ❤️",

  "Un rébus spécial nous deux t'attend !",

  "Quelle chanson te fait penser à nous ?",

  "Place les souvenirs dans le bon ordre !",

  "Surprise du jour : tu as gagné un petit bon pour une activité ensemble.",

  "Raconte-moi trois souvenirs que tu aimerais revivre.",

  "Devine la photo mystère !",

  "Défi du jour : donne-moi cinq choses que tu aimes chez moi.",

  "Une petite énigme sur notre histoire t'attend.",

  "Quel est ton souvenir préféré de nous deux ?",

  "Petit jeu : tu préfères quoi ?",

  "Surprise : une petite vidéo rien que pour toi !",

  "Voyons si tu me connais aussi bien que tu le penses !",

  "Défi cuisine : préparons la même recette à distance.",

  "Remets les mots dans le bon ordre pour découvrir mon message secret.",

  "Bon pour une soirée rien que tous les deux !",

  "Un dernier petit mot pour te rappeler combien tu comptes pour moi.",

  "Joyeux Noël mon amour ! ❤️ Voici ta dernière surprise."

];

const calendar = document.getElementById("calendar");

function updateCountdown() {

  const now = new Date();

  const christmas = new Date(2026, 11, 25);

  const days = Math.ceil((christmas - now) / 86400000);

  document.getElementById("countdown").textContent =

    days > 0 ? `Encore ${days} jours avant Noël 🎅` : "Joyeux Noël ! 🎄";

}

function openDay(day) {

  const now = new Date();

  const today =

    now.getFullYear() === 2026 && now.getMonth() === 11

      ? now.getDate()

      : 0;

  if (day > today) {

    alert("Encore un peu de patience... Cette surprise n'est pas encore disponible ! 🎁");

    return;

  }

  document.getElementById("modal-title").textContent =

    `Case n° ${day} 🎄`;

  document.getElementById("modal-text").textContent =

    activities[day - 1];

  document.getElementById("modal").classList.add("show");

}

function closeModal() {

  document.getElementById("modal").classList.remove("show");

}

for (let day = 1; day <= 24; day++) {

  const button = document.createElement("button");

  button.className = "day";

  button.innerHTML = `

    <span class="day-number">${day}</span>

    <span class="day-label">Décembre</span>

  `;

  button.addEventListener("click", () => openDay(day));

  calendar.appendChild(button);

}

document.getElementById("modal").addEventListener("click", (event) => {

  if (event.target.id === "modal") {

    closeModal();

  }

});

updateCountdown();

</script>

</body>

</html>
